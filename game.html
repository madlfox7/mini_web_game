<html lang="en">

        <meta charset="UTF-8">

        <title>Гоночная игра</title>
        <style>
            body {
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #2b2b2b;
                overflow: hidden;
            }

            .game-container {
                position: relative;
                width: 400px;
                height: 600px;
                background: #1e1e1e;
                overflow: hidden;
                border: 3px solid #000;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            }

            .road-line {
                position: absolute;
                width: 10px;
                height: 100px;
                background: white;
                left: 50%;
                transform: translateX(-50%);
                animation: road-scroll 1s linear infinite;
            }

            @keyframes road-scroll {
                from {
                    top: -100px;
                }

                to {
                    top: 600px;
                }
            }

                bottom: 20px;

    <body>
        <div class="game-container">
            <div class="score" id="score">Очки: 0</div>
            <div class="road-line" style="top: 0;"></div>
            <div class="road-line" style="top: 200px;"></div>
            <div class="road-line" style="top: 400px;"></div>
            <div class="car"></div>
            <div class="police-car" id="police-car"></div>
            <div class="obstacle" id="obstacle1"></div>
            <div class="obstacle" id="obstacle2"></div>
            
        </div>
        <div class="controls">
            <button class="control-button" id="left-btn">⬅</button>
            <button class="control-button" id="right-btn">➡</button>
        </div>
        <script>
            const car = document.querySelector('.car');
            const obstacle1 = document.getElementById('obstacle1');
            const obstacle2 = document.getElementById('obstacle2');
            const scoreDisplay = document.getElementById('score');
            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');
            
            let carPositionX = 180;
            let carPositionY = 20;
            let speedY = 0;
            let acceleration = 0.2;
            let deceleration = 0.3;
            let minFallSpeed = 2;
            let maxSpeedUp = 5;
            let score = 0;
            let speedUp = false;
            let normalSpeed = 20;
            let maxUpPosition = 300;
             let policeCarActive = false;
            let policeCarSpeed = 1;
            
            

           
function updatePoliceCarPosition() {
    if (policeCarActive && parseInt(policeCar.style.top) < 600) {
        let policePosition = parseInt(policeCar.style.top);
        policePosition += policeCarSpeed; // Normal movement speed
        policeCar.style.top = policePosition + 'px';

        // Check for collision with the player's car
        const carRect = car.getBoundingClientRect();
        const policeRect = policeCar.getBoundingClientRect();
        if (carRect.top < policeRect.bottom && carRect.bottom > policeRect.top && carRect.left < policeRect.right && carRect.right > policeRect.left) {
            alert('Caught by Police! Game Over! Score: ' + score);
            location.reload();
        }
    }
    if (policeCarActive && speedUp && Math.abs(parseInt(policeCar.style.left) - carPositionX) < 50) {
        policeCarSpeed = 5; // Chase speed when near and speeding up
    } else {
        policeCarSpeed = 1; // Reset to normal speed
    }
}

function randomizePoliceCar() {
    if (!policeCarActive && Math.random() < 0.1) { // 10% chance to spawn the police car
        policeCar.style.top = "-120px";
        policeCar.style.left = `${Math.random() * 350}px`;
        policeCarActive = true;
    }
}

setInterval(() => {
    updatePoliceCarPosition();
    randomizePoliceCar();
}, 20);

document.addEventListener('keydown', (event) => {
    if (event.code === 'ArrowLeft' && carPositionX > 0) {
        carPositionX -= normalSpeed;
    } else if (event.code === 'ArrowRight' && carPositionX < 350) {
        carPositionX += normalSpeed;
    } else if (event.code === 'ArrowUp') {
        speedUp = true;
    }
    car.style.left = `${carPositionX}px`;
});

document.addEventListener('keyup', (event) => {
    if (event.code === 'ArrowUp') {
        speedUp = false;
    }
});


document.addEventListener('keydown', (event) => {
    if (event.code === 'ArrowUp') {
        speedUp = true;
        policeCarActive = true; // Activate police car
        policeCar.style.top = '10px'; // Start close to top of screen
    }
});

document.addEventListener('keyup', (event) => {
    if (event.code === 'ArrowUp') {
        speedUp = false;
        policeCarActive = false; // Deactivate police car
        policeCar.style.top = '-150px'; // Reset position off-screen
    }
});

            // Base64 Encoded Images
         
            
            // === UPDATE CAR POSITION ===
            function updateCarPosition() {
                if (speedUp && carPositionY < maxUpPosition) {
                    speedY = Math.min(speedY + acceleration, maxSpeedUp);
                    carPositionY += speedY;
                } else if (!speedUp && carPositionY > 20) {
                    speedY = Math.max(speedY - deceleration, minFallSpeed);
                    carPositionY -= speedY;
                }

                if (carPositionY < 20) {
                    carPositionY = 20;
                    speedY = 0;
                }

                car.style.left = carPositionX + 'px';
                car.style.bottom = carPositionY + 'px';

                requestAnimationFrame(updateCarPosition);
            }
            requestAnimationFrame(updateCarPosition);

            // === LEFT/RIGHT MOVEMENT ===
            document.addEventListener('keydown', (event) => {
                if (event.code === 'ArrowLeft' && carPositionX > 0) {
                    carPositionX -= normalSpeed;
                    car.style.left = carPositionX + 'px';
                }
                if (event.code === 'ArrowRight' && carPositionX < 350) {
                    carPositionX += normalSpeed;
                    car.style.left = carPositionX + 'px';
                }
                if (event.code === 'ArrowUp') {
                    speedUp = true;
                }
            }
            );

            document.addEventListener('keyup', (event) => {
                if (event.code === 'ArrowUp') {
                    speedUp = false;
                }
            }
            );

            // === OBSTACLE MOVEMENT ===
            const moveObstacle = (obstacle, otherObstacle) => {
                let obstaclePosition = -100;
                let obstacleLeft = Math.random() * 350;
                const obstacleSpeed = 2 + Math.random() * 2;

                // Set a random Base64 image for each obstacle
                let randomImage = obstacleImages[Math.floor(Math.random() * obstacleImages.length)];
                obstacle.style.backgroundImage = `url('${randomImage}')`;
                obstacle.style.backgroundSize = 'contain';
                obstacle.style.backgroundRepeat = 'no-repeat';

                const interval = setInterval( () => {
                    obstaclePosition += obstacleSpeed;
                    obstacle.style.top = obstaclePosition + 'px';
                    obstacle.style.left = obstacleLeft + 'px';

                    // Collision Check
                    const carRect = car.getBoundingClientRect();
                    const obstacleRect = obstacle.getBoundingClientRect();

                    if (carRect.top < obstacleRect.bottom && carRect.bottom > obstacleRect.top && carRect.left < obstacleRect.right && carRect.right > obstacleRect.left) {
                        alert('Crash! Score: ' + score);
                        clearInterval(interval);
                        location.reload();
                    }

                    // Avoid Obstacles Overlapping
                    const otherObstacleRect = otherObstacle.getBoundingClientRect();
                    if (obstacleRect.top < otherObstacleRect.bottom && obstacleRect.bottom > otherObstacleRect.top && obstacleRect.left < otherObstacleRect.right && obstacleRect.right > otherObstacleRect.left) {
                        obstacleLeft = Math.random() * 350;
                    }

                    // Reset Obstacle
                    if (obstaclePosition > 600) {
                        obstaclePosition = -100;
                        obstacleLeft = Math.random() * 350;

                        // Apply a new random Base64 image
                        let newRandomImage = obstacleImages[Math.floor(Math.random() * obstacleImages.length)];
                        obstacle.style.backgroundImage = `url('${newRandomImage}')`;

                        score++;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                }
                , 20);
            }
            ;

            // Start obstacles
            moveObstacle(obstacle1, obstacle2);
            moveObstacle(obstacle2, obstacle1);
        </script>
